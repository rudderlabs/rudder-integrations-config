name: Deploy Configurations To Staging DB

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deployment To Staging DB
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      deploy_url: https://api.staging.rudderlabs.com
      ref: ${{ github.sha }}
    secrets:
      API_USERNAME: ${{ secrets.STAGING_USERNAME }}
      API_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
      SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID: ${{ secrets.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}

  trigger-post-deployment-tests:
    name: Trigger Post Deployment Tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rudder-api-test
          permission-actions: write

      - name: Trigger Post Deployment Tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/rudderlabs/rudder-api-test/actions/workflows/manual.yaml/dispatches \
            -d '{
              "ref":"main",
              "inputs":{
                "environment":"staging",
                "tag":"@custom",
                "custom_tag":"@retl and @enterprise"
              }
            }'
