name: Deploy Configurations To Staging DB

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deployment To Staging DB
    # Only release-please pull requests deploy to staging.
    if: startsWith(github.event.pull_request.head.ref, 'release-please--')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      deploy_url: https://api.staging.rudderlabs.com
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      API_USERNAME: ${{ secrets.STAGING_USERNAME }}
      API_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
      SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID: ${{ secrets.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}

  trigger-post-deployment-tests:
    name: Trigger Post Deployment Tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rudder-api-test
          permission-actions: write

      - name: Trigger Post Deployment Tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/rudderlabs/rudder-api-test/actions/workflows/manual.yaml/dispatches \
            -d '{
              "ref":"main",
              "inputs":{
                "environment":"staging",
                "tag":"@custom",
                "custom_tag":"@retl and @enterprise"
              }
            }'
