name: Dispatch SecretKeys Sync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dispatch-secretkeys-sync:
    name: Compare secretKeys and dispatch sync
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch pre-push revision
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::Before revision must be a non-zero 40-character SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Compare normalized secretKeys mappings
        id: compare
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/diffSecretKeys.js "$BEFORE_SHA" "$AFTER_SHA"

      - name: Generate transformer dispatch token
        if: steps.compare.outputs.changed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # GitHub requires target-repository contents write for repository_dispatch
          repositories: rudder-transformer

      - name: Dispatch secret-path manifest regeneration
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -n '{
            event_type: "regenerate-secret-path-manifest",
            client_payload: { source: "rudder-integrations-config" }
          }' | gh api --method POST repos/rudderlabs/rudder-transformer/dispatches --input -
