name: Dispatch SecretKeys Sync

on:
  push:
    branches:
      - main
    paths:
      - 'src/configurations/destinations/*/db-config.json'

permissions:
  contents: read

jobs:
  dispatch-secretkeys-sync:
    name: Compare secretKeys and dispatch sync
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare normalized secretKeys mappings
        id: compare
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const { BEFORE_SHA, AFTER_SHA } = process.env;
          const destinationConfigPattern =
            /^src\/configurations\/destinations\/([^/]+)\/db-config\.json$/;

          // Fails the step on an unknown or all-zero revision.
          const changedFiles = execFileSync(
            'git',
            ['diff', '--name-only', '--no-renames', '-z', BEFORE_SHA, AFTER_SHA, '--', 'src/configurations/destinations'],
            { encoding: 'utf8' },
          )
            .split('\0')
            .filter((file) => destinationConfigPattern.test(file));

          // Returns sorted secretKeys, or null when the file does not exist at the revision.
          function readSecretKeys(revision, file) {
            let raw;
            try {
              raw = execFileSync('git', ['show', `${revision}:${file}`], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              });
            } catch {
              return null;
            }
            const secretKeys = JSON.parse(raw).config.secretKeys ?? [];
            if (!Array.isArray(secretKeys) || secretKeys.some((key) => typeof key !== 'string')) {
              throw new Error(`${file} at ${revision}: config.secretKeys must be an array of strings`);
            }
            return [...secretKeys].sort();
          }

          const changedDestinations = changedFiles
            .filter(
              (file) =>
                JSON.stringify(readSecretKeys(BEFORE_SHA, file)) !==
                JSON.stringify(readSecretKeys(AFTER_SHA, file)),
            )
            .map((file) => destinationConfigPattern.exec(file)[1])
            .sort();

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `changed_destinations=${JSON.stringify(changedDestinations)}\n`,
          );
          console.log(
            changedDestinations.length > 0
              ? `secretKeys changed for destinations: ${changedDestinations.join(', ')}`
              : 'No normalized secretKeys changes detected.',
          );
          NODE

      - name: Generate transformer dispatch token
        if: steps.compare.outputs.changed_destinations != '[]'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # GitHub requires target-repository contents write for repository_dispatch
          repositories: rudder-transformer

      - name: Dispatch secret-path manifest regeneration
        if: steps.compare.outputs.changed_destinations != '[]'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          CHANGED_DESTINATIONS: ${{ steps.compare.outputs.changed_destinations }}
        run: |
          jq -n --argjson destinations "$CHANGED_DESTINATIONS" '{
            event_type: "regenerate-secret-path-manifest",
            client_payload: { source: "rudder-integrations-config", destinations: $destinations }
          }' | gh api --method POST repos/rudderlabs/rudder-transformer/dispatches --input -
