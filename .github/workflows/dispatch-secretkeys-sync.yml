name: Dispatch SecretKeys Sync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dispatch-secretkeys-sync:
    name: Compare secretKeys and dispatch sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate push revisions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          validate_revision() {
            local name="$1"
            local revision="$2"

            if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::${name} revision is not a 40-character SHA."
              return 1
            fi

            if [[ "$revision" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::${name} revision is the all-zero SHA."
              return 1
            fi

            if ! git cat-file -e "${revision}^{commit}"; then
              echo "::error::${name} revision is not available as a commit."
              return 1
            fi
          }

          validate_revision "Before" "$BEFORE_SHA"
          validate_revision "After" "$AFTER_SHA"

      - name: Compare normalized secretKeys mappings
        id: compare
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const destinationConfigPattern =
            /^src\/configurations\/destinations\/([^/]+)\/db-config\.json$/;

          function git(args, options = {}) {
            return execFileSync('git', args, {
              encoding: 'utf8',
              maxBuffer: 50 * 1024 * 1024,
              ...options,
            });
          }

          function normalizeRevision(revision) {
            const files = git([
              'ls-tree',
              '-r',
              '-z',
              '--name-only',
              revision,
              '--',
              'src/configurations/destinations',
            ])
              .split('\0')
              .filter(Boolean)
              .filter((file) => destinationConfigPattern.test(file))
              .sort();

            if (files.length === 0) {
              throw new Error(`No destination db-config.json files found at ${revision}`);
            }

            const mapping = new Map();

            for (const file of files) {
              const match = destinationConfigPattern.exec(file);
              const destination = match[1].normalize('NFC');

              if (!destination || mapping.has(destination)) {
                throw new Error(`Invalid or duplicate normalized destination name for ${file}`);
              }

              let definition;
              try {
                definition = JSON.parse(git(['show', `${revision}:${file}`]));
              } catch (error) {
                throw new Error(`Unable to parse ${file} at ${revision}`, { cause: error });
              }

              if (
                definition === null ||
                typeof definition !== 'object' ||
                Array.isArray(definition)
              ) {
                throw new Error(`${file} at ${revision} must contain a JSON object`);
              }

              const { config } = definition;
              if (config === null || typeof config !== 'object' || Array.isArray(config)) {
                throw new Error(`${file} at ${revision} must contain an object at config`);
              }

              const secretKeys = Object.prototype.hasOwnProperty.call(config, 'secretKeys')
                ? config.secretKeys
                : [];

              if (!Array.isArray(secretKeys)) {
                throw new Error(`${file} at ${revision} config.secretKeys must be an array`);
              }

              const normalizedSecretKeys = secretKeys
                .map((secretKey, index) => {
                  if (typeof secretKey !== 'string') {
                    throw new Error(
                      `${file} at ${revision} config.secretKeys[${index}] must be a string`,
                    );
                  }
                  return secretKey.normalize('NFC');
                })
                .sort();

              mapping.set(destination, normalizedSecretKeys);
            }

            return Object.fromEntries(
              [...mapping.entries()].sort(([left], [right]) =>
                left < right ? -1 : left > right ? 1 : 0,
              ),
            );
          }

          const before = normalizeRevision(process.env.BEFORE_SHA);
          const after = normalizeRevision(process.env.AFTER_SHA);
          const destinations = [...new Set([...Object.keys(before), ...Object.keys(after)])].sort(
            (left, right) => (left < right ? -1 : left > right ? 1 : 0),
          );
          const changedDestinations = destinations.filter(
            (destination) =>
              JSON.stringify(before[destination] ?? null) !== JSON.stringify(after[destination] ?? null),
          );

          const changed = changedDestinations.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `changed_destinations=${JSON.stringify(changedDestinations)}\n`,
          );

          if (changed) {
            console.log(`secretKeys changed for destinations: ${changedDestinations.join(', ')}`);
          } else {
            console.log('No normalized secretKeys changes detected.');
          }
          NODE

      - name: Generate transformer dispatch token
        if: steps.compare.outputs.changed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # GitHub requires target-repository contents write for repository_dispatch
          repositories: rudder-transformer

      - name: Dispatch secret-path manifest regeneration
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          CHANGED_DESTINATIONS: ${{ steps.compare.outputs.changed_destinations }}
        run: |
          set -euo pipefail

          payload=$(node -e '
            const destinations = JSON.parse(process.env.CHANGED_DESTINATIONS);
            process.stdout.write(JSON.stringify({
              event_type: "regenerate-secret-path-manifest",
              client_payload: {
                source: "rudder-integrations-config",
                destinations,
              },
            }));
          ')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/rudderlabs/rudder-transformer/dispatches
