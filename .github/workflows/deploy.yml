name: Deploy Configurations To DB

on:
  workflow_call:
    inputs:
      deploy_url:
        required: true
        type: string
      notify:
        type: boolean
      version:
        type: string
      ref:
        type: string
        required: true
      verbose:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    secrets:
      API_USERNAME:
        required: true
      API_PASSWORD:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      SLACK_RELEASE_CHANNEL_ID:
        required: true
      SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deployment To DB
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        env:
          HUSKY: 0
        run: |
          npm run setup

      - name: Display Python Version
        run: |
          which python
          python -c "import sys; print(sys.version)"

      - name: Execute Unit Tests
        env:
          HUSKY: 0
        run: |
          npm run test:ci

      - name: List Working Directory Files
        run: |
          echo current directory
          pwd
          ls -a

      - name: Display Current Package Version
        run: echo $(jq -r .version package.json)

      - name: Deploy Accounts To DB
        env:
          API_USER: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
        run: |
          python scripts/deployAccountsToDB.py "$DRY_RUN_FLAG" "$DEPLOY_URL"
        continue-on-error: false

      - name: Deploy Destination & Source Definitions To DB
        env:
          API_USER: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
        run: |
          python scripts/deployToDB.py "$DRY_RUN_FLAG" "$DEPLOY_URL"

      - name: Notify Slack Channel On Deployment Failure
        id: slack_failure
        # Pinned to v2.1.1 → commit 91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        continue-on-error: true
        if: failure() && inputs.dry_run == false
        env:
          PROJECT_NAME: 'Rudder Integrations Config'
          RUN_URL: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}",
              "text": ":rotating_light: ${{ env.PROJECT_NAME }} deployment failed for `${{ inputs.deploy_url }}` on `${{ inputs.ref }}`. Run: ${{ env.RUN_URL }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":rotating_light:  ${{ env.PROJECT_NAME }} Deployment Failed"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Target:*\n${{ inputs.deploy_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Ref:*\n${{ inputs.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ inputs.version || 'not provided' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Actor:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow run:*\n<${{ env.RUN_URL }}|Open failed deployment run>"
                  }
                }
              ]
            }

      - name: Notify Slack Channel
        id: slack
        # Pinned to v2.1.1 → commit 91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        continue-on-error: true
        if: inputs.notify == true && inputs.dry_run == false
        env:
          PROJECT_NAME: 'Rudder Integrations Config'
          RELEASES_URL: 'https://github.com/rudderlabs/rudder-integrations-config/releases/tag/'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "*<${{env.RELEASES_URL}}v${{ inputs.version }}|v${{ inputs.version }}>*\nCC: <!subteam^S02AEQL26CT>",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":tada:  ${{ env.PROJECT_NAME }} - Production Deployment Complete  :tada:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*<${{env.RELEASES_URL}}v${{ inputs.version }}|v${{ inputs.version }}>*\nCC: <!subteam^S02AEQL26CT>"
                  }
                }
              ]
            }
