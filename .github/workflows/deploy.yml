name: Deploy Configurations To DB

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target deploy environment (development, staging, or production). Drives which definitions are skipped on production.'
        required: true
        type: string
      deploy_url:
        required: true
        type: string
      notify:
        type: boolean
      version:
        type: string
      ref:
        type: string
        required: true
      verbose:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    secrets:
      API_USERNAME:
        required: true
      API_PASSWORD:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      SLACK_RELEASE_CHANNEL_ID:
        required: true
      SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deployment To DB
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        env:
          HUSKY: 0
        run: |
          npm run setup

      - name: Display Python Version
        run: |
          which python
          python -c "import sys; print(sys.version)"

      - name: Execute Unit Tests
        env:
          HUSKY: 0
        run: |
          npm run test:ci

      - name: List Working Directory Files
        run: |
          echo current directory
          pwd
          ls -a

      - name: Display Current Package Version
        run: echo $(jq -r .version package.json)

      - name: Deploy Accounts To DB
        env:
          API_USER: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
        run: |
          python scripts/deployAccountsToDB.py "$DRY_RUN_FLAG" "$DEPLOY_URL" --environment "$DEPLOY_ENV"
        continue-on-error: false

      - name: Deploy Destination & Source Definitions To DB
        env:
          API_USER: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
        run: |
          python scripts/deployToDB.py "$DRY_RUN_FLAG" "$DEPLOY_URL" --environment "$DEPLOY_ENV"

      - name: Notify Slack Channel On Deployment Failure
        id: slack_failure
        # Pinned to v2.1.1 → commit 91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        continue-on-error: true
        if: failure() && inputs.dry_run == false
        env:
          PROJECT_NAME: 'Integrations Config'
          RUN_URL: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID: ${{ secrets.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ env.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}",
              "text": ${{ toJSON(format(':rotating_light: {0} deployment failed for {1} (`{2}`) on `{3}`. Run: {4}', env.PROJECT_NAME, inputs.environment, inputs.deploy_url, inputs.ref, env.RUN_URL)) }},
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ${{ toJSON(format(':rotating_light:  {0} Deployment Failed', env.PROJECT_NAME)) }}
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJSON(format('*Target:* {0}', inputs.deploy_url)) }}
                    },
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJSON(format('*Environment:* {0}', inputs.environment)) }}
                    },
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJSON(format('*Ref:* {0}', inputs.ref)) }}
                    },
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJSON(format('*Version:* {0}', inputs.version || 'not provided')) }}
                    },
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJSON(format('*Actor:* {0}', github.actor)) }}
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('*Workflow run:* <{0}|Open failed deployment run>', env.RUN_URL)) }}
                  }
                }
              ]
            }

      - name: Notify Slack Channel
        id: slack
        # Pinned to v2.1.1 → commit 91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        continue-on-error: true
        if: success() && inputs.notify == true && inputs.dry_run == false
        env:
          PROJECT_NAME: 'Integrations Config'
          RELEASES_URL: 'https://github.com/rudderlabs/rudder-integrations-config/releases/tag/'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "*<${{env.RELEASES_URL}}v${{ inputs.version }}|v${{ inputs.version }}>*\nCC: <!subteam^S02AEQL26CT>",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":tada:  ${{ env.PROJECT_NAME }} - Production Deployment Complete  :tada:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*<${{env.RELEASES_URL}}v${{ inputs.version }}|v${{ inputs.version }}>*\nCC: <!subteam^S02AEQL26CT>"
                  }
                }
              ]
            }
