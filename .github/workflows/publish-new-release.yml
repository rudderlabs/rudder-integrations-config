name: Publish New GitHub Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Publish New GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix-release/')) && github.event.pull_request.merged == true # only merged pull requests must trigger this job

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Extract Version
        id: extract-version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          branch_name="${HEAD_REF}"
          version=${branch_name#hotfix-}
          version=${version#release/v}

          echo "release_version=$version" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits, tags, and releases
          permission-pull-requests: write # to create and update PRs

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        env:
          HUSKY: 0
        run: |
          npm ci

      - name: Create Tag and GitHub Release
        id: create_release
        env:
          HUSKY: 0
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.release_version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Validate RELEASE_VERSION (derived from the branch name) is SemVer before
          # interpolating it into tag/release names and shell arguments. Fail fast on
          # a malformed branch name rather than creating an invalid tag/release.
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid RELEASE_VERSION '${RELEASE_VERSION}' (expected SemVer x.y.z)"
            exit 1
          fi

          # Create annotated tag object via GitHub API (matching original git tag -a behavior)
          TAG_SHA=$(gh api "repos/${REPO}/git/tags" \
            --method POST \
            -f tag="v${RELEASE_VERSION}" \
            -f message="chore: release v${RELEASE_VERSION}" \
            -f object="${MERGE_SHA}" \
            -f type="commit" \
            --jq '.sha')

          # Create tag ref pointing to the annotated tag object
          gh api "repos/${REPO}/git/refs" \
            --method POST \
            -f ref="refs/tags/v${RELEASE_VERSION}" \
            -f sha="$TAG_SHA"

          # Slice the CHANGELOG section for this version. The `^#+ \[` pattern matches
          # both "## [x.y.z]" (minor/major) and "### [x.y.z]" (patch) headings.
          RELEASE_NOTES="$(awk -v v="${RELEASE_VERSION}" '$0 ~ "^#+ \\["v"\\]"{f=1;next} /^#+ \[/{if(f)exit} f' CHANGELOG.md)"
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "::error::No CHANGELOG section found for v${RELEASE_VERSION}"
            exit 1
          fi

          # Create the GitHub release with notes sliced from CHANGELOG.md.
          # Use explicit tag + repo so the release always matches the tag we
          # just created and lands on this repo (avoids conventional-github-releaser
          # inferring a stale version from tag history or the wrong repo from package.json).
          gh release create "v${RELEASE_VERSION}" \
            --repo "${REPO}" \
            --title "v${RELEASE_VERSION}" \
            --notes "${RELEASE_NOTES}"
          echo "DATE=$(date)" >> $GITHUB_ENV

      - name: Pull Changes Into develop Branch
        run: |
          gh pr create \
            --base develop \
            --head main \
            --title "chore(release): pull main into develop post release v${RELEASE_VERSION}" \
            --body ":crown: *An automated PR*"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.release_version }}

      - name: Delete Release Branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        with:
          branches: 'release/*'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Delete Hotfix Release Branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'hotfix-release/')
        with:
          branches: 'hotfix-release/*'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Notify Slack Channel
        id: slack
        # Pinned to v2.1.1 → commit 91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        continue-on-error: true
        env:
          PROJECT_NAME: 'Rudder Integrations Config'
          RELEASES_URL: 'https://github.com/rudderlabs/rudder-integrations-config/releases/tag/'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "*<${{env.RELEASES_URL}}v${{ steps.extract-version.outputs.release_version }}|v${{ steps.extract-version.outputs.release_version }}>*\nCC: <!subteam^S02AEQL26CT>",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":tada:  ${{ env.PROJECT_NAME }} - New GitHub Release  :tada:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*<${{env.RELEASES_URL}}v${{ steps.extract-version.outputs.release_version }}|v${{ steps.extract-version.outputs.release_version }}>*\nCC: <!subteam^S02AEQL26CT>"
                  }
                }
              ]
            }
