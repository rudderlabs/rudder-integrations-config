name: Manual Deploy Configurations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_url:
        description: 'Deploy URL'
        required: true
        type: string
      notify:
        description: 'Send Slack notification'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version to deploy'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy (branch/tag/commit)'
        required: true
        type: string
        default: 'main'
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Validate Production Deployment
        env:
          DEPLOY_URL: ${{ inputs.deploy_url }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$DEPLOY_URL" == "https://api.rudderstack.com" ]]; then
            if [[ "$REF" != "main" ]]; then
              echo "❌ Error: Production deployments can only be made from the 'main' branch"
              echo "Current branch: $REF"
              echo "Production URL: $DEPLOY_URL"
              exit 1
            fi
            echo "✅ Production deployment validation passed - deploying from main branch"
          else
            echo "ℹ️  Non-production deployment - branch validation skipped"
          fi

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_url: ${{ inputs.deploy_url }}
      notify: ${{ inputs.notify }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      verbose: ${{ inputs.verbose }}
    secrets:
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
