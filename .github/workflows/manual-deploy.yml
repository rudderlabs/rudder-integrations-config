name: Manual Deploy Configurations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      dry_run:
        description: 'Dry run (preview only, no changes applied)'
        required: false
        type: boolean
        default: true
      notify:
        description: 'Send Slack notification (ignored when dry run is enabled)'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version to deploy'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy (main, v* tag, or non-production branch/commit)'
        required: true
        type: string
        default: 'main'
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      deployment_ref: ${{ steps.validate-deployment.outputs.deployment_ref }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Validate Deployment
        id: validate-deployment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ inputs.ref }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
          STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        run: |
          deployment_ref="$REF"

          case "$ENVIRONMENT" in
            development) USER_VAR=DEV_USERNAME;     PASS_VAR=DEV_PASSWORD ;;
            staging)    USER_VAR=STAGING_USERNAME; PASS_VAR=STAGING_PASSWORD ;;
            production) USER_VAR=PROD_USERNAME;    PASS_VAR=PROD_PASSWORD ;;
            *)          echo "❌ Unsupported environment '$ENVIRONMENT'"; exit 1 ;;
          esac
          if [[ -z "${!USER_VAR}" || -z "${!PASS_VAR}" ]]; then
            echo "❌ Missing credentials for environment '$ENVIRONMENT' (expected repo secrets $USER_VAR and $PASS_VAR)"
            exit 1
          fi
          echo "✅ Credentials present for environment '$ENVIRONMENT'"

          if [[ "$ENVIRONMENT" == "production" ]]; then
            if [[ "$REF" == "main" ]]; then
              deployment_ref="main"
            elif [[ "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              if ! git ls-remote --exit-code --tags origin "refs/tags/$REF" > /dev/null 2>&1; then
                echo "❌ Error: Release tag '$REF' does not exist"
                exit 1
              fi
              deployment_ref="refs/tags/$REF"
            else
              echo "❌ Error: Production deployments can only be made from 'main' or an exact semantic-version v* tag name"
              echo "Current ref: $REF"
              exit 1
            fi
            echo "✅ Production deployment validation passed - deploying from $deployment_ref"
          else
            echo "ℹ️  Production ref validation skipped (environment=$ENVIRONMENT, dry_run=$DRY_RUN)"
          fi

          echo "deployment_ref=$deployment_ref" >> "$GITHUB_OUTPUT"

  validate-actor:
    name: Validate Production Actor
    if: ${{ inputs.environment == 'production' && inputs.dry_run == false }}
    uses: ./.github/workflows/validate-actor.yml
    with:
      team_names: 'integrations,data-management,sdk_team'
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  deploy:
    needs: [validate, validate-actor]
    if: ${{ always() && needs.validate.result == 'success' && (needs.validate-actor.result == 'success' || needs.validate-actor.result == 'skipped') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      deploy_url: >-
        ${{ inputs.environment == 'production' && 'https://api.rudderstack.com'
         || inputs.environment == 'staging' && 'https://api.staging.rudderlabs.com'
         || 'https://api.dev.rudderlabs.com' }}
      notify: ${{ inputs.notify }}
      version: ${{ inputs.version }}
      ref: ${{ needs.validate.outputs.deployment_ref }}
      verbose: ${{ inputs.verbose }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      API_USERNAME: >-
        ${{ inputs.environment == 'production' && secrets.PROD_USERNAME
         || inputs.environment == 'staging' && secrets.STAGING_USERNAME
         || secrets.DEV_USERNAME }}
      API_PASSWORD: >-
        ${{ inputs.environment == 'production' && secrets.PROD_PASSWORD
         || inputs.environment == 'staging' && secrets.STAGING_PASSWORD
         || secrets.DEV_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
      SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID: ${{ secrets.SLACK_ALERTS_INTEGRATIONS_CHANNEL_ID }}
